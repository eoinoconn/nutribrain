[project]
name = "nutribrain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"alembic>=1.13.2",
	"fastapi>=0.115.0",
	"fastmcp>=2.10.0",
	"httpx>=0.27.0",
	"psycopg>=3.2.0",
	"pydantic-settings>=2.4.0",
	"sqlalchemy>=2.0.35",
	"structlog>=24.4.0",
	"uvicorn>=0.30.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
	"coverage>=7.6.0",
	"mypy>=1.11.0",
	"pytest>=8.3.0",
	"pytest-asyncio>=0.24.0",
	"ruff>=0.6.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "DTZ"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["app.domain", "app.domain.*"]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
