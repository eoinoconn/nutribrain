# Render Blueprint — see https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nutrition-api
    runtime: python
    rootDir: api
    plan: starter
    buildCommand: uv sync && uv run alembic upgrade head
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # from Neon
        sync: false
      - key: APP_TOKEN             # generated once
        sync: false
      - key: CORS_ORIGIN            # set after first deploy, once nutrition-web's actual URL is known
        sync: false
      - key: INTERVALS_API_KEY
        sync: false
      - key: INTERVALS_ATHLETE_ID
        sync: false
      - key: TZ
        value: Europe/Dublin
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID  # from Google Cloud Console (docs/features/mcp_oauth.md F-105); leave unset to keep /mcp on APP_TOKEN only
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: MCP_ALLOWED_EMAIL      # the one Google account allowed to authenticate to /mcp
        sync: false
      - key: MCP_PUBLIC_BASE_URL     # set after first deploy, once nutrition-api's actual URL is known (must match the Google OAuth client's redirect URI)
        sync: false

  - type: web
    runtime: static
    name: nutrition-web
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE           # set after first deploy, once nutrition-api's actual URL is known
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: cron
    name: nutrition-cron
    runtime: python
    rootDir: api
    schedule: "0 11,18 * * *"      # 12:00 & 19:00 Irish time (IST=UTC+1); Render cron is UTC-only and won't auto-adjust for DST — shift to 12,19 UTC when Ireland switches back to GMT
    buildCommand: uv sync
    startCommand: uv run python -m app.intervals.sync_recent
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: nutrition-api
          envVarKey: DATABASE_URL
      - key: INTERVALS_API_KEY
        fromService:
          type: web
          name: nutrition-api
          envVarKey: INTERVALS_API_KEY
      - key: INTERVALS_ATHLETE_ID
        fromService:
          type: web
          name: nutrition-api
          envVarKey: INTERVALS_ATHLETE_ID
      - key: INTERVALS_SYNC_DAYS
        value: "3"
      - key: TZ
        value: Europe/Dublin
