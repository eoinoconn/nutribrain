# Render Blueprint — see https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nutrition-api
    runtime: python
    rootDir: api
    plan: starter
    buildCommand: uv sync && uv run alembic upgrade head
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # from Neon
        sync: false
      - key: APP_TOKEN             # generated once
        sync: false
      - key: CORS_ORIGIN            # set after first deploy, once nutrition-web's actual URL is known
        sync: false
      - key: INTERVALS_API_KEY
        sync: false
      - key: INTERVALS_ATHLETE_ID
        sync: false
      - key: TZ
        value: Europe/Dublin
      - key: LOG_LEVEL
        value: INFO
      - key: SENTRY_DSN
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID  # from Google Cloud Console (docs/features/mcp_oauth.md F-105); leave unset to keep /mcp on APP_TOKEN only
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: MCP_ALLOWED_EMAIL      # the one Google account allowed to authenticate to /mcp
        sync: false
      - key: MCP_PUBLIC_BASE_URL     # set after first deploy, once nutrition-api's actual URL is known (must match the Google OAuth client's redirect URI)
        sync: false

  - type: web
    runtime: static
    name: nutrition-web
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE           # set after first deploy, once nutrition-api's actual URL is known
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Upstream Intervals.icu MCP server (https://github.com/futureweb/intervals-mcp-server),
  # exposed to Claude.ai as a custom connector at <MCP_PUBLIC_URL>/mcp behind its built-in OAuth.
  - type: web
    name: intervals-mcp
    runtime: python
    rootDir: intervals-mcp
    plan: starter                  # persistent disks need a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: FASTMCP_PORT=$PORT futureweb-intervals-mcp
    disk:
      name: intervals-mcp-data     # OAuth clients + refresh tokens; without it every deploy disconnects Claude
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: API_KEY
        fromService:
          type: web
          name: nutrition-api
          envVarKey: INTERVALS_API_KEY
      - key: ATHLETE_ID
        fromService:
          type: web
          name: nutrition-api
          envVarKey: INTERVALS_ATHLETE_ID
      - key: MCP_TRANSPORT
        value: http
      - key: FASTMCP_HOST
        value: 0.0.0.0
      - key: FORWARDED_ALLOW_IPS     # Render's proxy terminates TLS in front of uvicorn
        value: "*"
      - key: MCP_AUTH
        value: oauth
      - key: MCP_PUBLIC_URL          # set after first deploy, once intervals-mcp's actual URL is known (no trailing slash)
        sync: false
      - key: OAUTH_STATE_FILE
        value: /var/data/oauth_state.json
      - key: OAUTH_LOGIN             # sign in with the Intervals.icu API key + authenticator code
        value: apikey
      - key: OAUTH_TOTP_SECRET       # generate locally: python -m intervals_mcp_server.auth totp-secret
        sync: false
      - key: OAUTH_CLIENT_HOSTS
        value: claude.ai,claude.com
      - key: OAUTH_REDIRECT_HOSTS
        value: claude.ai/api/mcp/auth_callback,claude.com/api/mcp/auth_callback
      - key: MCP_PERMISSIONS         # read only; widen to read,write to let Claude edit the calendar
        value: read
      - key: ATHLETE_TIMEZONE
        value: Europe/Dublin

  - type: cron
    name: nutrition-cron
    runtime: python
    rootDir: api
    schedule: "0 11,18 * * *"      # 12:00 & 19:00 Irish time (IST=UTC+1); Render cron is UTC-only and won't auto-adjust for DST — shift to 12,19 UTC when Ireland switches back to GMT
    buildCommand: uv sync
    startCommand: uv run python -m app.intervals.sync_recent
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: nutrition-api
          envVarKey: DATABASE_URL
      - key: INTERVALS_API_KEY
        fromService:
          type: web
          name: nutrition-api
          envVarKey: INTERVALS_API_KEY
      - key: INTERVALS_ATHLETE_ID
        fromService:
          type: web
          name: nutrition-api
          envVarKey: INTERVALS_ATHLETE_ID
      - key: INTERVALS_SYNC_DAYS
        value: "3"
      - key: TZ
        value: Europe/Dublin
